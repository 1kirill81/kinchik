services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kino2_web
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_BASE_URL=${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      - TMDB_IMAGE_BASE_URL=${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      - JACKETT_URL=http://jackett:9117
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - TORRSERVER_URL=http://torrserver:8090
      - NEXT_PUBLIC_TORRSERVER_URL=${NEXT_PUBLIC_TORRSERVER_URL:-http://localhost:8090}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be configured}
      - MAX_REMUX_CONCURRENCY=${MAX_REMUX_CONCURRENCY:-2}
    volumes:
      - kino_data:/app/data
    depends_on:
      torrserver:
        condition: service_healthy
      jackett:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 256M
    networks:
      - kino_net

  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.150
    container_name: kino2_torrserver
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8090:8090"
    volumes:
      - torrserver_data:/opt/ts/torrents
    environment:
      - TS_PORT=8090
      - TS_DONTKILL=1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/echo || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - kino_net

  jackett:
    image: lscr.io/linuxserver/jackett:version-v0.24.3053
    container_name: kino2_jackett
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=false
    ports:
      - "9117:9117"
    volumes:
      - jackett_config:/config
      - jackett_downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9117 || curl -f http://127.0.0.1:9117 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - kino_net

volumes:
  kino_data:
  torrserver_data:
  jackett_config:
  jackett_downloads:

networks:
  kino_net:
    driver: bridge
