# Конфигурация Nginx Reverse Proxy для KinoStream
# Скопируйте этот файл в /etc/nginx/sites-available/kinostream.conf на сервере
# И замените ВАШ_ДОМЕН на ваш реальный домен (например kino.mooo.com)

server {
    listen 80;
    server_name ВАШ_ДОМЕН;

    client_max_body_size 100M;

    # 1. Веб-интерфейс кинотеатра (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Видеостриминг TorrServer через HTTPS (защита от ошибки Mixed Content в браузерах)
    location /torrserver/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключение буферизации Nginx для непрерывного потока торрент-видео
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
