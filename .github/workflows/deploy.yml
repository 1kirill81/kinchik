name: CI / CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint Flat Config Check
        run: npm run lint

      - name: Vitest Suite
        run: npm test

      - name: Production Dependency Audit
        run: npm run audit:prod

      - name: Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          JWT_SECRET: ${{ secrets.JWT_SECRET || '12345678901234567890123456789012' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'dummy_test_key' }}
          JACKETT_API_KEY: ${{ secrets.JACKETT_API_KEY || 'dummy_test_key' }}

  deploy:
    name: Deploy to VPS
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Начинаем деплой Kinostream на сервере..."

            TARGET_DIR="/opt/kino2/kinchik"
            if [ ! -d "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/kino2"
            fi
            if [ ! -d "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/kino2"
            fi

            cd "$TARGET_DIR"

            echo "📥 Получение свежего кода из git..."
            git pull origin main || git pull origin master

            echo "🐳 Пересборка и запуск Docker контейнеров..."
            docker rm -f kino2_web $(docker ps -aq --filter "name=_kino2_web") 2>/dev/null || true
            docker compose up -d --build --remove-orphans

            echo "⏳ Ожидание старта сервисов и прогрева healthcheck..."
            HEALTHY=0
            for i in $(seq 1 12); do
              if curl -s -f http://127.0.0.1:3000/api/health | grep -q '"status":"healthy"'; then
                echo "✅ Healthcheck подтвержден (попытка $i)!"
                HEALTHY=1
                break
              fi
              echo "Ожидание контейнера web... ($i/12)"
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Healthcheck провален! Проверяем логи контейнера web:"
              docker logs --tail 50 kino2_web || true
              exit 1
            fi

            echo "🧹 Очистка старых неиспользуемых Docker слоев..."
            docker image prune -f

            echo "🎉 Деплой успешно завершен и проверен healthcheck-ом!"
