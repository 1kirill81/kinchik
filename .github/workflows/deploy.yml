name: CI / CD Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Позволяет запускать деплой вручную из вкладки Actions в GitHub

jobs:
  build-and-test:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Test Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'dummy_test_key' }}
          JACKETT_API_KEY: ${{ secrets.JACKETT_API_KEY || 'dummy_test_key' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy_jwt_secret_test' }}

  deploy:
    name: Deploy to Production Server
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Начинаем деплой Kinostream на сервере..."

            # Директория проекта на сервере
            TARGET_DIR="/opt/kino2/kinchik"
            if [ ! -d "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/kino2"
            fi
            if [ ! -d "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/kino2"
            fi

            cd "$TARGET_DIR"

            echo "📥 Получение свежего кода из git..."
            git pull origin main || git pull origin master

            echo "🐳 Пересборка и запуск Docker контейнеров..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "🧹 Очистка старых неиспользуемых Docker слоев..."
            docker image prune -f

            echo "⏳ Ожидание старта сервисов (10 сек)..."
            sleep 10

            echo "🔍 Проверка доступности сайта..."
            curl -f http://localhost:3000 || echo "⚠️ Предупреждение: локальный healthcheck вернул ошибку"

            echo "✅ Деплой успешно завершен!"
